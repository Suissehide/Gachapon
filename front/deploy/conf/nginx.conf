# Pages utilitaires : atteignables, jamais indexables. En-tête plutôt que
# balise <meta>, seule façon de couvrir /invitations/<token>, qui n'a pas de
# fichier prérendu. Sur $request_uri et non $uri : try_files fait une
# redirection interne vers /index.html, qui réécrit $uri.
#
# Le préfixe de langue est OPTIONNEL dans le motif (`(/(fr|en))?`) plutôt que
# dupliqué sur une seconde ligne : depuis le lot 2 ces pages vivent sous /fr et
# /en, mais deux listes à tenir en parallèle divergeraient au premier ajout, et
# une page utilitaire redevenue indexable dans UNE seule langue est exactement
# le genre de défaut qui ne se voit pas.
map $request_uri $robots_tag {
    default "";
    ~^(/(fr|en))?/(forgot-password|reset-password|verify-email|pending|dev-reveal|oauth/success|invitations/) "noindex, nofollow";
}

# Langue de destination de la 302 sur `/`. Doit rester d'accord avec
# `resolveRedirectLocale()` de front/src/main.tsx : anglais par défaut,
# français pour un navigateur francophone, et `?lang=` prioritaire.
#
# La clé est la concaténation "<?lang>:<Accept-Language>". nginx évalue
# d'abord les correspondances exactes puis les expressions régulières DANS
# L'ORDRE DE DÉCLARATION — d'où `?lang=` en premier.
#
# `~:\s*fr` ne regarde que le PREMIER tag d'Accept-Language : un navigateur
# qui annonce "en-US,en;q=0.9,fr;q=0.8" préfère l'anglais, et un `~*fr`
# gourmand l'enverrait sur le site français.
#
# CE QUE NGINX NE PEUT PAS VOIR : la préférence mémorisée dans localStorage,
# que main.tsx consulte AVANT la langue du navigateur. Un visiteur qui a choisi
# le français dans un navigateur anglophone atterrira sur /en en tapant le
# domaine nu. C'est la contrepartie de rediriger avant que React ne démarre ;
# elle ne coûte qu'un aller-retour, le sélecteur de langue restant disponible.
map "$arg_lang:$http_accept_language" $root_locale {
    default              "en";
    "~^fr:"              "fr";
    "~^en:"              "en";
    "~:\s*fr([-_;,]|$)"  "fr";
}

# Ancien domaine : tout part en 301 vers le nouveau. `$request_uri` conserve le
# chemin et la query string, pour qu'un lien déjà partagé vers /guide atterrisse
# sur /guide et non sur l'accueil.
#
# ATTENTION À L'ORDRE DE DÉPLOIEMENT : tant que playgachapon.com ne résout pas,
# ce bloc rend gachapon.qwetle.fr — donc le site en production — inaccessible.
# Ne déployer qu'une fois le DNS du nouveau domaine en place et son certificat
# émis. Bloc à supprimer le jour où l'ancien domaine est abandonné.
#
# Volontairement absent pour api.gachapon.qwetle.fr : une API ne se redirige
# pas. Beaucoup de clients HTTP ne suivent pas un 301 sur un POST, et certains
# perdent les en-têtes personnalisés — donc le X-API-Key — en chemin. L'ancien
# hôte de l'API doit rester servi, pas redirigé.
server {
    listen 80;
    server_name gachapon.qwetle.fr;

    return 301 https://playgachapon.com$request_uri;
}

# Le domaine courant, et tout hôte non listé ci-dessus.
#
# `default_server` est indispensable et pas décoratif : `server_name _` n'est
# pas un catch-all, c'est juste un nom qu'aucun Host ne peut valoir. Sans cette
# directive, nginx désigne comme serveur par défaut le *premier* bloc du port —
# celui de la redirection — et le nouveau domaine se ferait rediriger vers
# lui-même.
server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Robots-Tag $robots_tag always;

    # Location relative ("/fr/guide") et non absolue ("http://host/fr/guide").
    #
    # `absolute_redirect on` est le DÉFAUT de nginx, et il est faux ici : TLS
    # est terminé par Traefik, donc nginx ne voit que du HTTP en clair et
    # reconstruirait chaque Location en `http://…`. Toutes les redirections de
    # ce bloc — la 302 de langue et les 301 des anciennes URLs — renverraient
    # le visiteur en clair, pour un aller-retour supplémentaire au mieux.
    # Mesuré sur le conteneur local avant correction :
    #   curl -I localhost/guide → Location: http://127.0.0.1/fr/guide
    # Une Location relative est valide (RFC 7231 §7.1.2) et suivie par tous les
    # navigateurs ; c'est aussi ce qui rend ces redirections testables sans
    # dépendre du Host.
    absolute_redirect off;

    # 302 et non 301 : la cible dépend du visiteur (voir $root_locale), la
    # mettre en cache la figerait sur la langue du premier passant — y compris
    # dans les caches intermédiaires et dans Chrome, qui garde les 301
    # indéfiniment. Exactement l'inverse des 301 incluses juste en dessous, qui
    # ont une cible unique et doivent être cachées.
    #
    # `location = /` seule : la racine n'a plus de page depuis le lot 3, les
    # deux accueils sont /fr et /en.
    location = / {
        return 302 /$root_locale$is_args$args;
    }

    # 301 de chaque ancienne URL publique (sans préfixe) vers son équivalent
    # /fr/… Le site n'existait qu'en français avant ce chantier : tout le
    # capital d'indexation à préserver est français.
    #
    # Fichier GÉNÉRÉ au build par front/scripts/prerender-seo.mjs, depuis
    # SEO_ROUTES — la même source que le sitemap. La spec l'exige (§8) pour
    # qu'aucune liste d'URLs ne soit tenue à la main ici : elle prendrait du
    # retard au premier ajout de route, exactement comme le sitemap le faisait
    # avant d'être généré. Le Dockerfile le dépose dans /etc/nginx/snippets/.
    #
    # Joker et non chemin nommé : un `include` dont le motif ne correspond à
    # aucun fichier est accepté par nginx, alors qu'un chemin nommé absent
    # empêche le démarrage. Cette conf reste donc utilisable sans le fragment
    # (nginx nu, test local, image construite autrement) — au prix, assumé, de
    # ne pas signaler un fragment oublié.
    include /etc/nginx/snippets/seo-*.conf;

    # `$uri/index.html` sert les fichiers de scripts/prerender-seo.mjs
    # (dist/fr/<route>/index.html et dist/en/<route>/index.html). Sans lui,
    # toutes les routes retombent sur index.html et se canonicalisent vers `/`.
    location / {
        try_files $uri $uri/index.html /index.html;
    }

    # Sert correctement les fichiers JS/CSS/Vite assets
    location /assets/ {
        try_files $uri =404;
    }

    error_page 404 /index.html;
}
