server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # `$uri/index.html` sert les fichiers de scripts/prerender-seo.mjs. Sans lui,
    # toutes les routes retombent sur index.html et se canonicalisent vers `/`.
    location / {
        try_files $uri $uri/index.html /index.html;
    }

    # Sert correctement les fichiers JS/CSS/Vite assets
    location /assets/ {
        try_files $uri =404;
    }

    error_page 404 /index.html;
}