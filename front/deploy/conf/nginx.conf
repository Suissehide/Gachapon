server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Sert directement les fichiers statiques.
    # `$uri/index.html` est indispensable : `scripts/prerender-seo.mjs` génère un
    # `dist/<route>/index.html` par route publique (titre, description, canonical
    # pré-injectés). Sans cette étape, `/about` retombe sur le index.html racine
    # et Googlebot voit 4 URLs identiques canonicalisées vers `/` → non indexées.
    location / {
        try_files $uri $uri/index.html /index.html;
    }

    # Sert correctement les fichiers JS/CSS/Vite assets
    location /assets/ {
        try_files $uri =404;
    }

    error_page 404 /index.html;
}